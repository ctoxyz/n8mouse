[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n8mouse"
version = "0.3.0"
description = "Share one keyboard, mouse and clipboard across your computers over the LAN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pynput>=1.7", "pyperclip>=1.8"]
keywords = ["kvm", "synergy", "keyboard", "mouse", "clipboard"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
n8mouse = "n8mouse:main"

[tool.setuptools]
py-modules = ["n8mouse"]
