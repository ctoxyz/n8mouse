# Push a tag like v0.3.0 -> builds Windows + macOS apps and publishes a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pyinstaller==6.11.1 pynput==1.8.1 pyperclip==1.9.0 pillow==12.3.0
      - name: Build n8mouse.exe (terminal) and n8mousew.exe (background, no window)
        shell: pwsh
        run: |
          $hidden = "--hidden-import", "pynput.keyboard._win32", "--hidden-import", "pynput.mouse._win32", "--icon", "packaging\windows\n8mouse.ico"
          pyinstaller --onefile --console   --name n8mouse  @hidden n8mouse.py
          pyinstaller --onefile --noconsole --name n8mousew @hidden n8mouse.py
          dist\n8mouse.exe version
      # Optional: free code signing for open source via SignPath Foundation (signpath.org).
      # Add their GitHub action here once the project is approved.
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\n8mouse.exe, dist\n8mousew.exe -DestinationPath n8mouse-windows-x64.zip
          (Get-FileHash n8mouse-windows-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii n8mouse-windows-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: n8mouse-windows-x64.zip*

  macos:
    runs-on: macos-14
    env:
      APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pyinstaller==6.11.1 pynput==1.8.1 pyperclip==1.9.0
      - name: Build n8mouse.app (background app, no Dock icon)
        run: |
          pyinstaller --windowed --name n8mouse --osx-bundle-identifier com.n8mouse.app \
            --icon packaging/macos/n8mouse.icns \
            --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin n8mouse.py
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" dist/n8mouse.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(sed -n 's/^VERSION = "\(.*\)"/\1/p' n8mouse.py)" dist/n8mouse.app/Contents/Info.plist
          dist/n8mouse.app/Contents/MacOS/n8mouse version
      # Sign + notarize with the BillZero, Inc. Developer ID. Unsigned apps are blocked
      # by Gatekeeper and can lose the Accessibility permission on every update.
      # Secrets: APPLE_SIGN_ID, APPLE_CERT_P12 (base64), APPLE_CERT_PASSWORD,
      # NOTARY_KEY_P8 (base64 of the App Store Connect API .p8), NOTARY_KEY_ID, NOTARY_ISSUER.
      - if: startsWith(github.ref, 'refs/tags/') && env.APPLE_SIGN_ID == ''
        name: Refuse to release unsigned
        run: |
          echo "::error::APPLE_SIGN_ID is not set - a tagged release must be signed and notarized"
          exit 1
      - if: env.APPLE_SIGN_ID != ''
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - if: env.APPLE_SIGN_ID != ''
        name: Sign and notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/notary_key.p8"
          trap 'rm -f "$KEY"' EXIT
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY"
          codesign --deep --force --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist --sign "$APPLE_SIGN_ID" dist/n8mouse.app
          ditto -c -k --keepParent dist/n8mouse.app notarize.zip
          xcrun notarytool submit notarize.zip --wait --output-format json \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" > notary.json || true
          cat notary.json
          SUB_ID=$(python3 -c "import json; print(json.load(open('notary.json')).get('id', ''))" 2>/dev/null || true)
          STATUS=$(python3 -c "import json; print(json.load(open('notary.json')).get('status', ''))" 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization status: ${STATUS:-none}"
            if [ -n "$SUB_ID" ]; then
              xcrun notarytool log "$SUB_ID" --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            fi
            exit 1
          fi
          xcrun stapler staple dist/n8mouse.app
          codesign --verify --deep --strict --verbose=2 dist/n8mouse.app
          codesign -dv --verbose=4 dist/n8mouse.app 2>&1 | grep -E '^(Authority|Timestamp|CodeDirectory)'
          spctl -a -vvv -t exec dist/n8mouse.app
          xcrun stapler validate dist/n8mouse.app
      - name: Package
        run: |
          ditto -c -k --keepParent dist/n8mouse.app n8mouse-macos-arm64.zip
          shasum -a 256 n8mouse-macos-arm64.zip | cut -d' ' -f1 > n8mouse-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: n8mouse-macos-arm64.zip*

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
